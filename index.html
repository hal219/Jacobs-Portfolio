<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jacob Reyes — Photography</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:#0a0a0a;
      --panel:#111111;
      --border: rgba(255,255,255,0.08);
      --fg:#efece6;
      --fg-2: rgba(239,236,230,0.55);
      --fg-3: rgba(239,236,230,0.35);
      --accent:#E89B6B;
      --cols: 4;
      --gap: 14px;
      --radius: 2px;
      --sidebar-w: 240px;
      --rail-w: 0px;

      --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
      --font-ui: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    /* ---------------- Layout shell ---------------- */
    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr var(--rail-w);
      min-height: 100vh;
    }

    /* ---------------- Sidebar ---------------- */
    .sidebar {
      position: sticky; top: 0;
      height: 100vh;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      border-right: 1px solid var(--border);
      background: var(--panel);
    }
    .brand { display: flex; flex-direction: column; gap: 10px; }
    .monogram {
      width: 48px; height: 48px;
      display: grid; place-items: center;
      border: 1px solid var(--fg);
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: 20px;
      font-style: italic;
      letter-spacing: 0.02em;
      color: var(--fg);
    }
    .brand-name {
      margin-top: 14px;
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1.0;
      letter-spacing: -0.005em;
      color: var(--fg);
    }
    .brand-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--fg-3);
    }
    .vnav { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
    .vnav a {
      font-size: 13.5px;
      letter-spacing: 0.02em;
      color: var(--fg-2);
      width: max-content;
      position: relative;
      padding: 2px 0;
      transition: color .25s ease;
    }
    .vnav a:hover { color: var(--fg); }
    .vnav a.active { color: var(--fg); }
    .vnav a.active::after {
      content: ""; position: absolute; left: 0; right: -22px; bottom: 8px;
      height: 1px; background: var(--accent);
      transform-origin: left;
    }
    .socials {
      margin-top: 16px;
      display: flex; gap: 14px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--fg-3);
    }
    .socials a { transition: color .2s; }
    .socials a:hover { color: var(--fg); }

    /* ---------------- Main ---------------- */
    .main { padding: 28px 32px 48px; min-width: 0; }

    /* ---------------- Topbar ---------------- */
    .topbar {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }
    .count { display: flex; align-items: baseline; gap: 10px; }
    .count-num {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 34px;
      line-height: 1;
      color: var(--fg);
    }
    .count-lbl {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--fg-3);
      text-transform: uppercase;
    }
    .filters {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }
    .fbtn {
      font-size: 12.5px;
      letter-spacing: 0.02em;
      color: var(--fg-2);
      padding: 8px 12px;
      border-radius: 999px;
      transition: color .2s, background .2s;
      position: relative;
    }
    .fbtn:hover { color: var(--fg); }
    .fbtn.on {
      color: var(--bg);
      background: var(--fg);
    }
    .theme-dark .fbtn.on { color: #0a0a0a; }
    .theme-light .fbtn.on { color: #ffffff; }

    /* ---------------- Grid (CSS columns masonry) ---------------- */
    .grid {
      column-count: var(--cols);
      column-gap: var(--gap);
    }
    .card {
      display: block;
      width: 100%;
      padding: 0;
      margin: 0 0 var(--gap);
      break-inside: avoid;
      position: relative;
      overflow: hidden;
      border-radius: var(--radius);
      background: var(--panel);
      cursor: zoom-in;
      opacity: 0;
      transform: translateY(8px);
      animation: cardIn .55s cubic-bezier(.22,.61,.36,1) forwards;
    }
    @keyframes cardIn { to { opacity: 1; transform: none; } }

    .ph-img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .9s cubic-bezier(.22,.61,.36,1), filter .35s ease;
      background: var(--panel);
      -webkit-user-drag: none;
    }
    .card:hover .ph-img { transform: scale(1.04); }
    .card .card-overlay {
      position: absolute; inset: 0;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.55) 100%);
      opacity: 0;
      transition: opacity .35s ease;
      pointer-events: none;
    }
    .theme-light .card .card-overlay {
      background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.45) 100%);
    }
    .card:hover .card-overlay { opacity: 1; }
    .caps-always .card .card-overlay { opacity: 1; }
    .caps-none   .card .card-overlay { opacity: 0 !important; }

    .card-meta { display: flex; flex-direction: column; gap: 2px; color: #fff; }
    .card-title {
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.18em;
    }
    .card-sub {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 16px;
      line-height: 1.2;
      color: rgba(255,255,255,0.85);
    }
    .card-cat {
      position: absolute;
      top: 12px; left: 14px;
      font-family: var(--font-mono);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.85);
      text-transform: uppercase;
      padding: 4px 8px;
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 999px;
      backdrop-filter: blur(4px);
    }

    /* ---------------- Action rail (right) ---------------- */
    .rail {
      position: sticky;
      top: 96px;
      align-self: start;
      margin-top: 96px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 6px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      width: 32px;
      justify-self: center;
    }
    .rail button {
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: 999px;
      color: var(--fg-2);
      transition: color .2s, background .2s;
    }
    .rail button:hover { color: var(--fg); background: rgba(255,255,255,0.05); }
    .theme-light .rail button:hover { background: rgba(0,0,0,0.05); }

    /* ---------------- Footer ---------------- */
    .foot {
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 10.5px;
      letter-spacing: 0.16em;
      color: var(--fg-3);
      text-transform: uppercase;
    }
    .foot .dot { opacity: 0.6; }

    /* ---------------- Lightbox ---------------- */
    .lightbox {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.86);
      backdrop-filter: blur(8px);
      display: grid;
      place-items: center;
      animation: lbIn .25s ease forwards;
    }
    .theme-light .lightbox { background: rgba(20,16,12,0.78); }
    @keyframes lbIn { from { opacity: 0; } to { opacity: 1; } }
    .lb-close {
      position: absolute; top: 22px; right: 22px;
      width: 38px; height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      display: grid; place-items: center;
      transition: background .2s;
    }
    .lb-close:hover { background: rgba(255,255,255,0.08); }
    .lb-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 38px; height: 38px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      display: grid; place-items: center;
      transition: background .2s;
    }
    .lb-nav.left  { left: 22px; }
    .lb-nav.right { right: 22px; }
    .lb-nav:hover { background: rgba(255,255,255,0.08); }
    .lb-figure {
      max-width: min(78vw, 1100px);
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 0;
    }
    .lb-image {
      max-height: 76vh;
      max-width: 78vw;
      overflow: hidden;
      border-radius: var(--radius);
      background: #000;
    }
    .lb-image .ph-img { width: 100%; height: 100%; object-fit: contain; }
    .lb-cap { display: flex; flex-direction: column; gap: 4px; color: #fff; }
    .lb-cap-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.22em;
    }
    .lb-cap-meta {
      font-family: var(--font-display);
      font-style: italic;
      font-size: 18px;
      color: rgba(255,255,255,0.78);
      display: flex; gap: 8px; align-items: baseline;
    }
    .lb-cap-meta .dot { opacity: 0.5; }

    /* ---------------- Responsive ---------------- */
    @media (max-width: 1100px) {
      :root { --cols: 3; --sidebar-w: 200px; }
    }
    @media (max-width: 820px) {
      :root { --cols: 2; --sidebar-w: 100%; --rail-w: 0px; }
      .shell { grid-template-columns: 1fr; }
      .sidebar {
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        align-items: center;
        gap: 18px;
        padding: 16px 20px;
        flex-wrap: wrap;
      }
      .brand { flex: 1 1 auto; flex-direction: row; align-items: center; gap: 12px; }
      .brand-name { font-size: 22px; margin-top: 0; }
      .brand-tag { display: none; }
      .vnav { margin-top: 0; flex-direction: row; gap: 16px; flex-wrap: wrap; }
      .vnav a.active::after { display: none; }
      .socials { margin-top: 0; }
      .rail { display: none; }
      .main { padding: 18px 18px 32px; }
      .count-num { font-size: 26px; }
    }
    @media (max-width: 520px) {
      :root { --cols: 1; }
      .vnav, .socials { display: none; }
      .filters { gap: 0; }
      .fbtn { padding: 6px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script type="text/babel">
/* ─── tweaks-panel.jsx ─────────────────────────────────────────────────────── */

const __TWEAKS_STYLE = `

  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}

    border:2px solid transparent;background-clip:content-box}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}

  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;box-sizing:border-box;width:100%;min-width:0;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;

  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  select.twk-field{padding-right:22px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(0,0,0,.5)' d='M0 0h10L5 6z'/></svg>");

  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakColor({ label, value, options, onChange }) {
  const __twkIsLight = (hex) => {
    const h = String(hex).replace('#', '');
    const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
    const n = parseInt(x.slice(0, 6), 16);
    if (Number.isNaN(n)) return true;
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return r * 299 + g * 587 + b * 114 > 148000;
  };
  const TwkCheck = ({ light }) => (
    <svg viewBox="0 0 14 14" aria-hidden="true">
      <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
            strokeLinecap="round" strokeLinejoin="round"
            stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
    </svg>
  );

  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function Lightbox({ photo, onClose, onPrev, onNext }) {
  useEffect(() => {
    if (!photo) return;
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      else if (e.key === "ArrowLeft") onPrev();
      else if (e.key === "ArrowRight") onNext();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [photo, onClose, onPrev, onNext]);

  if (!photo) return null;
  return (
    <div className="lightbox" onClick={onClose}>
      <button className="lb-close" onClick={onClose} aria-label="Close"><CloseIcon /></button>
      <button className="lb-nav left"  onClick={(e) => { e.stopPropagation(); onPrev(); }} aria-label="Previous"><ArrowIcon dir="left" /></button>
      <button className="lb-nav right" onClick={(e) => { e.stopPropagation(); onNext(); }} aria-label="Next"><ArrowIcon /></button>
      <figure className="lb-figure" onClick={(e) => e.stopPropagation()}>

    </div>
  );
}

const TWEAK_DEFAULTS = {
  "name": "Jacob Bautista",
  "monogram": "JB",
  "theme": "light",
  "accent": "#E89B6B",
  "columns": 4,
  "gap": 14,
  "rounded": 2,
  "captionStyle": "minimal",
  "fontPair": "editorial"
};

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [active, setActive] = useState("all");
  const [openId, setOpenId] = useState(null);
  const [hovered, setHovered] = useState(null);

  const visible = useMemo(
    () => (active === "all" ? PHOTOS : PHOTOS.filter((p) => p.cat === active)),
    [active]
  );

  const openIdx = visible.findIndex((p) => p.id === openId);
  const openPhoto = openIdx >= 0 ? visible[openIdx] : null;
  const prev = () => openIdx >= 0 && setOpenId(visible[(openIdx - 1 + visible.length) % visible.length].id);
  const next = () => openIdx >= 0 && setOpenId(visible[(openIdx + 1) % visible.length].id);

  const dark = t.theme === "dark";

  useLayoutEffect(() => {
    const r = document.documentElement;
    r.style.setProperty("--accent", t.accent);
    if (t.columns !== TWEAK_DEFAULTS.columns) {
      r.style.setProperty("--cols", String(t.columns));
    } else {
      r.style.removeProperty("--cols");
    }
    r.style.setProperty("--gap", `${t.gap}px`);
    r.style.setProperty("--radius", `${t.rounded}px`);

    if (dark) {
      r.style.setProperty("--bg",     "#0a0a0a");
      r.style.setProperty("--panel",  "#111111");
      r.style.setProperty("--border", "rgba(255,255,255,0.08)");
      r.style.setProperty("--fg",     "#efece6");
      r.style.setProperty("--fg-2",   "rgba(239,236,230,0.55)");
      r.style.setProperty("--fg-3",   "rgba(239,236,230,0.35)");
    } else {
      r.style.setProperty("--bg",     "#f6f4ef");
      r.style.setProperty("--panel",  "#ffffff");
      r.style.setProperty("--border", "rgba(20,16,12,0.10)");
      r.style.setProperty("--fg",     "#181613");
      r.style.setProperty("--fg-2",   "rgba(24,22,19,0.62)");
      r.style.setProperty("--fg-3",   "rgba(24,22,19,0.40)");
    }

    if (t.fontPair === "editorial") {
      r.style.setProperty("--font-display", "'Cormorant Garamond', 'Times New Roman', serif");
      r.style.setProperty("--font-ui",      "'Helvetica Neue', Helvetica, Arial, sans-serif");
    } else if (t.fontPair === "modernist") {
      r.style.setProperty("--font-display", "'Helvetica Neue', Helvetica, Arial, sans-serif");
      r.style.setProperty("--font-ui",      "'Helvetica Neue', Helvetica, Arial, sans-serif");
    } else if (t.fontPair === "mono") {
      r.style.setProperty("--font-display", "'JetBrains Mono', ui-monospace, Menlo, monospace");
      r.style.setProperty("--font-ui",      "'Helvetica Neue', Helvetica, Arial, sans-serif");
    }
  }, [t.accent, t.columns, t.gap, t.rounded, t.fontPair, dark]);

  return (
    <div className={`shell theme-${t.theme} caps-${t.captionStyle}`}>
      <Sidebar name={t.name} monogram={t.monogram} />
      <main className="main">
        <TopBar active={active} onPick={setActive} count={visible.length} />
        <Grid
          photos={visible}
          onOpen={setOpenId}
          hovered={hovered}
          setHovered={setHovered}
        />
        <footer className="foot">
          <span>© {new Date().getFullYear()} {t.name}</span>
          <span className="dot">·</span>
          <span>Available for commissions — Spring 2026</span>
        </footer>
      </main>
      <Lightbox
        photo={openPhoto}
        onClose={() => setOpenId(null)}
        onPrev={prev}
        onNext={next}
      />

      <TweaksPanel title="Tweaks">
        <TweakSection label="Identity">
          <TweakText  label="Name"     value={t.name}      onChange={(v) => setTweak("name", v)} />
          <TweakText  label="Monogram" value={t.monogram}  onChange={(v) => setTweak("monogram", v)} />
        </TweakSection>
        <TweakSection label="Theme">
          <TweakRadio
            label="Mode"
            value={t.theme}
            options={[{ value: "dark", label: "Dark" }, { value: "light", label: "Light" }]}
            onChange={(v) => setTweak("theme", v)}
          />
          <TweakColor
            label="Accent"
            value={t.accent}
            options={["#E89B6B", "#C6A87A", "#7AA8C6", "#9BB07A", "#C77A8D", "#E8E8E8"]}
            onChange={(v) => setTweak("accent", v)}
          />
          <TweakSelect
            label="Type"
            value={t.fontPair}
            options={[
              { value: "editorial", label: "Editorial (serif + sans)" },
              { value: "modernist", label: "Modernist (sans only)" },
              { value: "mono",      label: "Mono display + sans" },
            ]}
            onChange={(v) => setTweak("fontPair", v)}
          />
        </TweakSection>
        <TweakSection label="Grid">
          <TweakSlider label="Columns" min={2} max={6} step={1} value={t.columns} onChange={(v) => setTweak("columns", v)} />
          <TweakSlider label="Gap"     min={0} max={32} step={2} value={t.gap}    onChange={(v) => setTweak("gap", v)} />
          <TweakSlider label="Radius"  min={0} max={16} step={1} value={t.rounded} onChange={(v) => setTweak("rounded", v)} />

              { value: "minimal", label: "On hover" },
              { value: "always",  label: "Always" },

            ]}
            onChange={(v) => setTweak("captionStyle", v)}
          />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

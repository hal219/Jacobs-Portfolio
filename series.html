<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Series — Coming Soon — Jacob Bautista</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:#f6f4ef;
      --panel:#ffffff;
      --border: rgba(20,16,12,0.10);
      --fg:#181613;
      --fg-2: rgba(24,22,19,0.62);
      --fg-3: rgba(24,22,19,0.40);
      --accent:#E89B6B;
      --sidebar-w: 240px;

      --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
      --font-ui: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100vh;
    }
    a { color: inherit; text-decoration: none; }

    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: 100vh;
    }

    /* Sidebar — matches other pages */
    .sidebar {
      position: sticky; top: 0;
      height: 100vh;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      border-right: 1px solid var(--border);
      background: var(--panel);
    }
    .brand { display: flex; flex-direction: column; gap: 10px; }
    .monogram {
      width: 48px; height: 48px;
      display: grid; place-items: center;
      border: 1px solid var(--fg);
      border-radius: 999px;
      font-family: var(--font-display);
      font-size: 20px;
      font-style: italic;
      color: var(--fg);
    }
    .brand-name {
      margin-top: 14px;
      font-family: var(--font-display);
      font-size: 28px;
      line-height: 1.0;
      color: var(--fg);
    }
    .brand-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.22em;
      color: var(--fg-3);
    }
    .vnav { margin-top: auto; display: flex; flex-direction: column; gap: 14px; }
    .vnav a {
      font-size: 13.5px;
      color: var(--fg-2);
      width: max-content;
      position: relative;
      padding: 2px 0;
      transition: color .25s ease;
    }
    .vnav a:hover { color: var(--fg); }
    .vnav a.active { color: var(--fg); }
    .vnav a.active::after {
      content: ""; position: absolute; left: 0; right: -22px; bottom: 8px;
      height: 1px; background: var(--accent);
    }
    .socials {
      margin-top: 16px;
      display: flex; gap: 14px;
      color: var(--fg-3);
    }
    .socials a { transition: color .2s; display: inline-flex; }
    .socials a:hover { color: var(--fg); }

    /* Coming soon stage */
    .stage {
      display: grid;
      place-items: center;
      padding: 64px 40px;
      min-height: 100vh;
      text-align: center;
    }
    .stage-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      max-width: 560px;
      opacity: 0;
      transform: translateY(8px);
      animation: rise .7s cubic-bezier(.22,.61,.36,1) forwards;
    }
    @keyframes rise { to { opacity: 1; transform: none; } }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.28em;
      color: var(--fg-3);
      text-transform: uppercase;
    }
    .headline {
      font-family: var(--font-display);
      font-style: italic;
      font-size: clamp(64px, 9vw, 120px);
      line-height: 1.0;
      letter-spacing: -0.01em;
      margin: 0;
      color: var(--fg);
    }
    .accent-rule {
      width: 56px;
      height: 1px;
      background: var(--accent);
      margin: 4px 0;
    }
    .blurb {
      font-size: 15px;
      line-height: 1.75;
      color: var(--fg-2);
      margin: 0;
      max-width: 460px;
    }
    .back-link {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--fg);
      border-bottom: 1px solid var(--fg-3);
      padding-bottom: 2px;
      transition: color .2s, border-color .2s;
    }
    .back-link:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* Responsive */
    @media (max-width: 1100px) {
      :root { --sidebar-w: 200px; }
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar {
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--border);
        flex-direction: row;
        align-items: center;
        gap: 18px;
        padding: 16px 20px;
        flex-wrap: wrap;
      }
      .brand { flex: 1 1 auto; flex-direction: row; align-items: center; gap: 12px; }
      .brand-name { font-size: 22px; margin-top: 0; }
      .brand-tag { display: none; }
      .vnav { margin-top: 0; flex-direction: row; gap: 16px; flex-wrap: wrap; }
      .vnav a.active::after { display: none; }
      .socials { margin-top: 0; }
      .stage { padding: 48px 24px; min-height: 0; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <a href="index.html" class="monogram" aria-label="Back to Work">JB</a>
        <div class="brand-name">Jacob Bautista</div>
        <div class="brand-tag">PHOTOGRAPHY · EST. 2026</div>
      </div>
      <nav class="vnav">
        <a href="index.html">Work</a>
        <a href="series.html" class="active">Series</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
      <div class="socials">
        <a href="https://www.instagram.com/mr.churro/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
          </svg>
        </a>
      </div>
    </aside>

    <main class="stage">
      <div class="stage-inner">
        <span class="eyebrow">Series</span>
        <h1 class="headline">Coming soon</h1>
        <div class="accent-rule"></div>
        <p class="blurb">
          A curated set of long-form photo essays is being assembled here. Check back shortly — or follow along on Instagram for previews.
        </p>
        <a class="back-link" href="index.html">Back to Work</a>
      </div>
    </main>
  </div>
</body>
</html>
